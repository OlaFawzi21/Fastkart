<ng-template #videoPlayModal let-modal>
   <div class="modal-header">
      <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')">
         <i class="ri-close-line"></i>
      </button>
   </div>

   @if(video || galleries){
      <div class="modal-body">
         <div class="modal-media">

            @if(type === 'video'){
               <video width="1000" height="590" controls>
                  <source [src]="video ? video.original_url : ''" [type]="video.mime_type">
               </video>
            }@else if (type === 'audio') {
               <div class="slider-image">
                  <div class="slider-main-img">
                     <audio controls>
                        <source [src]="video ? video.original_url : ''" [type]="video.mime_type">
                     </audio>
                  </div>
               </div>
            }@else if (type === 'img') {
               <ul>
                  <owl-carousel-o [options]="singleSlider">
                     @for(image of galleries; track image){
                        <ng-template carouselSlide>
                           <div class="slider-image">
                              <div class="slider-main-img">
                                 @if(videType.includes(image.mime_type)){
                                    <i class="ri-video-line"></i>
                                    <video class="w-100" controls>
                                       <source [src]="image ? image.original_url : ''" [type]="image.mime_type">
                                    </video>
                                 }@else if (audioType.includes(image.mime_type)) {
                                    <div class="slider-main-img">
                                       <audio controls>
                                          <source [src]="image ? image.original_url : ''" [type]="image.mime_type">
                                       </audio>
                                    </div>
                                 }@else {
                                    <img [src]="image?.original_url ? image?.original_url : 'assets/images/blog.png'" alt="image">
                                 }
                              </div>
                           </div>
                        </ng-template>
                     }
                  </owl-carousel-o>
               </ul>
            }
         </div>
      </div>
   }
</ng-template>
