<div class="accordion-body pt-0">
   <div class="product-tags-box">
      <ul>
         @for(tag of tags; track tag){
            <li>
               <a [routerLink]="['/blogs']" [queryParams]="{tag: tag?.slug}">{{ tag?.name }}</a>
            </li>
         }
      </ul>
   </div>
</div>
<!-- No Data -->
@if(!(tags && tags.length)){
   <app-no-data [class]="'no-data-added bg-light'" [text]="'no_tag_found'" >
   </app-no-data>
}
