<app-breadcrumb [breadcrumb]="breadcrumb"></app-breadcrumb>
<section class="blog-section section-b-space">
  <div class="container-fluid-lg">
    <div class="row g-4">
      <div class="col-xxl-9 col-xl-8 col-lg-7 order-lg-2">
        <ng-container *ngIf="blogService?.skeletonLoader; else blogContent">
          <div class="row g-4">
            <div *ngFor="let item of skeletonItems" class="col-xxl-4 col-sm-6">
              <app-skeleton-blog></app-skeleton-blog>
            </div>
          </div>
        </ng-container>
        <ng-template #blogContent>
          <ng-container *ngIf="(blog$ | async)?.data?.length; else noData">
            <div class="row g-4">
              <div
                *ngFor="let blog of (blog$ | async)?.data"
                class="col-xxl-4 col-sm-6"
              >
                <div class="blog-box">
                  <div *ngIf="blog?.is_featured" class="blog-label-tag">
                    <span>{{ "featured" | translate }}</span>
                  </div>
                  <div class="blog-image">
                    <a [routerLink]="['/blog/', blog?.slug]">
                      <img
                        [src]="
                          blog?.blog_thumbnail?.original_url ||
                          'assets/images/blog.png'
                        "
                        [alt]="blog?.title"
                      />
                    </a>
                  </div>
                  <div class="blog-contain blog-contain-2">
                    <div class="blog-label">
                      <span class="time">
                        <i class="ri-time-line"></i>
                        <span>{{
                          blog?.created_at | date : "dd MMM yyyy hh:mm:a"
                        }}</span>
                      </span>
                      <span
                        *ngIf="(themeOption$ | async)?.blog?.blog_author_enable"
                        class="super"
                      >
                        <i class="ri-user-line"></i>
                        <span>{{ blog?.created_by?.name }}</span>
                      </span>
                    </div>
                    <a [routerLink]="['/blog/', blog?.slug]">
                      <h3>{{ blog?.title }}</h3>
                    </a>
                    <p
                      *ngIf="blog?.description"
                      [innerHTML]="blog.description | summary : 200"
                    ></p>
                    <a
                      *ngIf="(themeOption$ | async)?.blog?.read_more_enable"
                      [routerLink]="['/blog/', blog?.slug]"
                      class="blog-button"
                    >
                      {{ "read_more" | translate }}
                      <i class="ri-arrow-right-fill"></i>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </ng-container>
          <ng-template #noData>
            <app-no-data
              class="no-data-added"
              image="assets/svg/empty-items.svg"
              text="no_blogs_found"
              description="not_find_any_blogs_matching_search_criteria"
            >
            </app-no-data>
          </ng-template>
        </ng-template>
        <nav
          *ngIf="(blog$ | async)?.data?.length && !blogService?.skeletonLoader"
          class="custome-pagination"
        >
          <app-pagination
            [total]="totalItems"
            [currentPage]="filter['page']"
            [pageSize]="filter['paginate']"
            (setPage)="setPaginate($event)"
          >
          </app-pagination>
        </nav>
      </div>
      <div class="col-xxl-3 col-xl-4 col-lg-5 order-lg-1">
        <div class="left-sidebar-box">
          <app-blog-sidebar></app-blog-sidebar>
        </div>
      </div>
    </div>
  </div>
</section>
